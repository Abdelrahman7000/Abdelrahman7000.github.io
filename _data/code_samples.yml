- title: "Data Cleaning and Processing using SQL"
  type: "SQL"
  description: "Cleans and transforms stock price data using CTEs, aggregations, and joins."
  code: |
    WITH cte AS (
      SELECT
        ticker,
        MAX(open) AS highest_open
      FROM stock_prices
      GROUP BY 1
    ),

    cte2 AS (
      SELECT
        ticker,
        MIN(open) AS lowest_open
      FROM stock_prices
      GROUP BY 1
    ),

    cte3 AS (
      SELECT
        cte.ticker,
        cte.highest_open,
        s.date AS highest_mth
      FROM cte
      JOIN stock_prices s
        ON cte.highest_open = s.open
    ),

    cte4 AS (
      SELECT
        cte2.ticker,
        cte2.lowest_open,
        s.date AS lowest_mth
      FROM cte2
      JOIN stock_prices s
        ON cte2.lowest_open = s.open
    )

    SELECT
      cte3.ticker,
      REPLACE(TO_CHAR(cte3.highest_mth, 'Mon-YYYY'), ' ', '') AS highest_mth,
      cte3.highest_open,
      REPLACE(TO_CHAR(cte4.lowest_mth, 'Mon-YYYY'), ' ', '') AS lowest_mth,
      cte4.lowest_open
    FROM cte3
    JOIN cte4 USING (ticker)
    ORDER BY 1

- title: "SQL in dbt"
  type: "dbt"
  description: "A dbt model that joins multiple staging models and is materialized as a view."
  code: |
    {{
      config(
        materialized='view'
      )
    }}

    WITH cte AS (
      SELECT
        c.CustomerID,
        c.CustomerName,
        c.Country,
        c.Email,
        c.Phone,
        n.NationName,
        n.Population,
        r.RegionName
      FROM {{ ref('stg_customers') }} c
      INNER JOIN {{ ref('stg_nations') }} n
        ON n.NationID = c.NationID
      INNER JOIN {{ ref('stg_regions') }} r
        ON r.RegionID = n.RegionID
    )

    SELECT *
    FROM cte

- title: "dbt Data Tests"
  type: "dbt"
  description: "Schema tests for staging models, including primary keys, relationships, and accepted values."
  code: |
    version: 2

    models:
      - name: stg_customers
        description: This model cleans the customer data, there is one record for each customer
        columns:
          - name: CustomerID
            description: Primary key
            tests:
              - unique
              - not_null

      - name: stg_orders
        description: This converts the data types of the order columns.
        columns:
          - name: OrderID
            tests:
              - unique
              - not_null

          - name: CustomerID
            tests:
              - not_null
              - relationships:
                  to: ref('stg_customers')
                  field: CustomerID

      - name: stg_nations
        columns:
          - name: NationID
            tests:
              - unique
              - not_null

      - name: stg_regions
        columns:
          - name: RegionName
            tests:
              - accepted_values:
                  values:
                    - 'North America'
                    - 'Europe'
                    - 'Oceania'
                    - 'Asia'
                    - 'South America'

      - name: customer_details
        description: This model joins regions, nations, and customers tables into one view.
